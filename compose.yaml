name: arcambe-geoanalytics
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: arcambe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-test-only}
      POSTGRES_DB: arcambe
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcambe"]
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    build: {context: ., dockerfile: infra/python.Dockerfile}
    environment: &python-env
      APP_ENV: ${APP_ENV:-test}
      DATABASE_URL: postgresql+psycopg://arcambe:${POSTGRES_PASSWORD:-local-test-only}@db:5432/arcambe
      DATA_DIR: /app/data
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      GCS_BUCKET: ${GCS_BUCKET:-}
      GCS_SIGNER_EMAIL: ${GCS_SIGNER_EMAIL:-}
      DAILY_JOB_LIMIT: ${DAILY_JOB_LIMIT:-5}
      DAILY_ATTEMPT_LIMIT: ${DAILY_ATTEMPT_LIMIT:-20}
      DOWNLOAD_SECRET: ${DOWNLOAD_SECRET:-local-test-only-randomize-in-production}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      STAC_URL: ${STAC_URL:-https://stac.dataspace.copernicus.eu/v1}
      RASTER_ALLOWED_HOSTS: ${RASTER_ALLOWED_HOSTS:-sentinel-cogs.s3.us-west-2.amazonaws.com,e84-earth-search-sentinel-data.s3.us-west-2.amazonaws.com,landsateuwest.blob.core.windows.net}
    command: ["alembic", "upgrade", "head"]
    volumes: ["raster-data:/app/data"]
    depends_on: {db: {condition: service_healthy}}
  api:
    build: {context: ., dockerfile: infra/python.Dockerfile}
    environment: *python-env
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["raster-data:/app/data"]
    depends_on: {migrate: {condition: service_completed_successfully}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 10
  processor:
    build: {context: ., dockerfile: infra/python.Dockerfile}
    environment: *python-env
    command: ["python", "-m", "services.api.jobs"]
    volumes: ["raster-data:/app/data"]
    depends_on: {migrate: {condition: service_completed_successfully}}
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
      args:
        API_URL: http://api:8000
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
    environment: {API_URL: "http://api:8000"}
    ports: ["127.0.0.1:3000:3000"]
    depends_on: {api: {condition: service_healthy}}
volumes:
  postgres:
  raster-data:

