version: 1.0.0
source_scope: CCRS manual explicitly names NDVI only; other indices are modern extension, see SOURCE_TRACEABILITY.md
provider: sentinel-2-l2a
input_units: surface_reflectance
default_resolution_policy: coarsest_native_band
band_native_resolution_m:
  B02: 10
  B03: 10
  B04: 10
  B05: 20
  B06: 20
  B07: 20
  B08: 10
  B8A: 20
  B11: 20
  B12: 20
processing:
  mask_scl_default:
  - 0
  - 1
  - 3
  - 8
  - 9
  - 10
  - 11
  denominator_epsilon: 1.0e-06
  nodata: masked_nan_internally_export_mask
  no_global_clipping: true
indices:
- id: NDVI
  title: Normalized Difference Vegetation Index
  category: Vegetation
  formula: (B08-B04)/(B08+B04)
  bands:
  - B08
  - B04
  native_output_resolution_m: 10
  input: calibrated_surface_reflectance
  required: true
  algorithm_version: 1.0.0
  notes: Do not interpret value as an automatically validated physical concentration/class.
- id: EVI
  title: Enhanced Vegetation Index
  category: Vegetation
  formula: 2.5*(B08-B04)/(B08+6*B04-7.5*B02+1)
  bands:
  - B08
  - B04
  - B02
  native_output_resolution_m: 10
  input: calibrated_surface_reflectance
  required: true
  algorithm_version: 1.0.0
  notes: Not bounded to [-1,1]; sensitive to reflectance calibration and denominator.
- id: EVI2
  title: Two-band EVI
  category: Vegetation
  formula: 2.5*(B08-B04)/(B08+2.4*B04+1)
  bands:
  - B08
  - B04
  native_output_resolution_m: 10
  input: calibrated_surface_reflectance
  required: true
  algorithm_version: 1.0.0
  notes: Do not interpret value as an automatically validated physical concentration/class.
- id: SAVI
  title: Soil Adjusted Vegetation Index
  category: Vegetation
  formula: (1+L)*(B08-B04)/(B08+B04+L)
  bands:
  - B08
  - B04
  native_output_resolution_m: 10
  input: calibrated_surface_reflectance
  required: true
  algorithm_version: 1.0.0
  notes: Do not interpret value as an automatically validated physical concentration/class.
  constants:
    L: 0.5
- id: MSAVI2
  title: Modified Soil Adjusted Vegetation Index 2
  category: Vegetation
  formula: (2*B08+1-sqrt((2*B08+1)^2-8*(B08-B04)))/2
  bands:
  - B08
  - B04
  native_output_resolution_m: 10
  input: calibrated_surface_reflectance
  required: true
  algorithm_version: 1.0.0
  notes: Do not interpret value as an automatically validated physical concentration/class.
- id: GNDVI
  title: Green Normalized Difference Vegetation Index
  category: Vegetation
  formula: (B08-B03)/(B08+B03)
  bands:
  - B08
  - B03
  native_output_resolution_m: 10
  input: calibrated_surface_reflectance
  required: true
  algorithm_version: 1.0.0
  notes: Do not interpret value as an automatically validated physical concentration/class.
- id: NDRE_B05
  title: Normalized Difference Red Edge Index (B05 variant)
  category: Vegetation
  formula: (B8A-B05)/(B8A+B05)
  bands:
  - B8A
  - B05
  native_output_resolution_m: 20
  input: calibrated_surface_reflectance
  required: true
  algorithm_version: 1.0.0
  notes: Do not interpret value as an automatically validated physical concentration/class.
- id: NDMI
  title: Normalized Difference Moisture Index (Gao-style NIR/SWIR)
  category: Moisture
  formula: (B08-B11)/(B08+B11)
  bands:
  - B08
  - B11
  native_output_resolution_m: 20
  input: calibrated_surface_reflectance
  required: true
  algorithm_version: 1.0.0
  notes: Do not interpret value as an automatically validated physical concentration/class.
- id: NDWI_MCF
  title: McFeeters Normalized Difference Water Index
  category: Water
  formula: (B03-B08)/(B03+B08)
  bands:
  - B03
  - B08
  native_output_resolution_m: 10
  input: calibrated_surface_reflectance
  required: true
  algorithm_version: 1.0.0
  notes: McFeeters Green/NIR water index, not Gao NDWI / NDMI.
- id: MNDWI
  title: Modified Normalized Difference Water Index
  category: Water
  formula: (B03-B11)/(B03+B11)
  bands:
  - B03
  - B11
  native_output_resolution_m: 20
  input: calibrated_surface_reflectance
  required: true
  algorithm_version: 1.0.0
  notes: Do not interpret value as an automatically validated physical concentration/class.
- id: NDBI
  title: Normalized Difference Built-up Index
  category: BuiltEnvironment
  formula: (B11-B08)/(B11+B08)
  bands:
  - B11
  - B08
  native_output_resolution_m: 20
  input: calibrated_surface_reflectance
  required: true
  algorithm_version: 1.0.0
  notes: Do not interpret value as an automatically validated physical concentration/class.
- id: NBR
  title: Normalized Burn Ratio
  category: Fire
  formula: (B08-B12)/(B08+B12)
  bands:
  - B08
  - B12
  native_output_resolution_m: 20
  input: calibrated_surface_reflectance
  required: true
  algorithm_version: 1.0.0
  notes: Do not interpret value as an automatically validated physical concentration/class.
- id: NBR2
  title: Normalized Burn Ratio 2
  category: Fire
  formula: (B11-B12)/(B11+B12)
  bands:
  - B11
  - B12
  native_output_resolution_m: 20
  input: calibrated_surface_reflectance
  required: true
  algorithm_version: 1.0.0
  notes: Do not interpret value as an automatically validated physical concentration/class.
- id: BSI
  title: Bare Soil Index (common SWIR/Red/NIR/Blue variant)
  category: Soil
  formula: ((B11+B04)-(B08+B02))/((B11+B04)+(B08+B02))
  bands:
  - B11
  - B04
  - B08
  - B02
  native_output_resolution_m: 20
  input: calibrated_surface_reflectance
  required: true
  algorithm_version: 1.0.0
  notes: Do not interpret value as an automatically validated physical concentration/class.
- id: NDSI_SNOW
  title: Normalized Difference Snow Index; same algebra as MNDWI, interpretation differs
  category: Snow
  formula: (B03-B11)/(B03+B11)
  bands:
  - B03
  - B11
  native_output_resolution_m: 20
  input: calibrated_surface_reflectance
  required: true
  algorithm_version: 1.0.0
  notes: Algebraically identical to MNDWI for these bands; snow interpretation requires environmental context and
    masking.
- id: MSI
  title: Moisture Stress Index
  category: Moisture
  formula: B11/B08
  bands:
  - B11
  - B08
  native_output_resolution_m: 20
  input: calibrated_surface_reflectance
  required: true
  algorithm_version: 1.0.0
  notes: Do not interpret value as an automatically validated physical concentration/class.
- id: ARVI
  title: Atmospherically Resistant Vegetation Index, gamma=1
  category: Vegetation
  formula: (B08-(2*B04-B02))/(B08+(2*B04-B02))
  bands:
  - B08
  - B04
  - B02
  native_output_resolution_m: 10
  input: calibrated_surface_reflectance
  required: true
  algorithm_version: 1.0.0
  notes: Do not interpret value as an automatically validated physical concentration/class.
- id: VARI
  title: Visible Atmospherically Resistant Index
  category: Vegetation
  formula: (B03-B04)/(B03+B04-B02)
  bands:
  - B03
  - B04
  - B02
  native_output_resolution_m: 10
  input: calibrated_surface_reflectance
  required: true
  algorithm_version: 1.0.0
  notes: Do not interpret value as an automatically validated physical concentration/class.
- id: SIPI
  title: Structure Insensitive Pigment Index
  category: Vegetation
  formula: (B08-B02)/(B08-B04)
  bands:
  - B08
  - B02
  - B04
  native_output_resolution_m: 10
  input: calibrated_surface_reflectance
  required: true
  algorithm_version: 1.0.0
  notes: Do not interpret value as an automatically validated physical concentration/class.
- id: CI_GREEN
  title: Green Chlorophyll Index (proxy; no direct concentration inference)
  category: Vegetation
  formula: B08/B03-1
  bands:
  - B08
  - B03
  native_output_resolution_m: 10
  input: calibrated_surface_reflectance
  required: true
  algorithm_version: 1.0.0
  notes: Do not interpret value as an automatically validated physical concentration/class.
- id: CI_RE
  title: Red-edge Chlorophyll Index using B8A/B05
  category: Vegetation
  formula: B8A/B05-1
  bands:
  - B8A
  - B05
  native_output_resolution_m: 20
  input: calibrated_surface_reflectance
  required: true
  algorithm_version: 1.0.0
  notes: Do not interpret value as an automatically validated physical concentration/class.
