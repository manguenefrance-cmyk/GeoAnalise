openapi: 3.1.0
info:
  title: ARCAMBE GeoAnalytics API
  version: 1.0.0
  description: Contract starting point; actual FastAPI spec generated from Pydantic
    models must enrich full paths and schemas.
servers:
- url: /v1
components:
  securitySchemes:
    FirebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            request_id:
              type: string
    ProjectCreate:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 180
        description:
          type: string
          maxLength: 2000
    AreaCreate:
      type: object
      required:
      - name
      - geometry
      properties:
        name:
          type: string
        geometry:
          type: object
          description: GeoJSON Polygon or MultiPolygon EPSG:4326; validated server
            side
    SceneSearch:
      type: object
      required:
      - aoi_id
      - date_start
      - date_end
      properties:
        aoi_id:
          type: string
          format: uuid
        date_start:
          type: string
          format: date
        date_end:
          type: string
          format: date
        max_cloud_cover:
          type: number
          minimum: 0
          maximum: 100
          default: 20
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
    AnalysisCreate:
      type: object
      required:
      - project_id
      - aoi_id
      - operation_kind
      - operation_id
      properties:
        project_id:
          type: string
          format: uuid
        aoi_id:
          type: string
          format: uuid
        scene_id:
          type: string
          format: uuid
        operation_kind:
          type: string
          enum:
          - index
          - band_ratio
          - temporal_diff
          - pca
          - composite
        operation_id:
          type: string
        input_analysis_ids:
          type: array
          items:
            type: string
            format: uuid
        params:
          type: object
security:
- FirebaseBearer: []
paths:
  /me:
    get:
      summary: Get own profile
      operationId: get_me
      responses:
        '200':
          description: Successful operation
        '400':
          description: Invalid input
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '429':
          description: Limit exceeded
    patch:
